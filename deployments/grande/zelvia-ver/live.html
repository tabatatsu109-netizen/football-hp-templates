<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ライブ速報 | 八ヶ岳グランデFC</title>
  <meta name="description" content="八ヶ岳グランデFC 試合ライブ速報">
  <meta name="theme-color" content="#0e3a1c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260807c">
  <style>
    body { background: #0a1f11; min-height: 100vh; font-family: 'Noto Sans JP', sans-serif; }
    .lv-wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
    .lv-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
    .lv-back { color: rgba(255,255,255,.7); text-decoration: none; font-size: 13px; font-weight: 700; }
    .lv-brand { display: flex; align-items: center; gap: 8px; color: #fff; font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 2px; }
    .lv-brand img { width: 30px; height: 30px; }

    .lv-status { text-align: center; margin: 6px 0 14px; }
    .lv-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 18px; border-radius: 99px;
      font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #fff;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    }
    .lv-pill--live { background: #c62828; border-color: #e53935; }
    .lv-pill--live .lv-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: lv-blink 1.1s ease-in-out infinite; }
    @keyframes lv-blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

    .lv-board {
      background: linear-gradient(135deg, #0e3a1c, #14532a);
      border: 1px solid rgba(200,169,74,.4); border-radius: 20px;
      padding: 24px 14px 20px; text-align: center; color: #fff;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
      position: relative; overflow: hidden;
    }
    .lv-board::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(-55deg, rgba(255,255,255,.03) 0 16px, transparent 16px 32px);
      pointer-events: none;
    }
    .lv-comp { font-size: 12.5px; color: rgba(255,255,255,.6); margin-bottom: 12px; }
    .lv-teams { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .lv-team { flex: 1; font-weight: 900; font-size: clamp(14px, 4vw, 18px); line-height: 1.4; }
    .lv-score {
      font-family: 'Oswald', sans-serif; font-weight: 700;
      font-size: clamp(56px, 17vw, 86px); line-height: 1; letter-spacing: 2px;
      min-width: 150px;
      transition: transform .3s;
    }
    .lv-score i { font-style: normal; color: #c8a94a; padding: 0 4px; font-size: .7em; vertical-align: 8px; }
    .lv-score.bump { animation: lv-bump .6s cubic-bezier(.2,2.4,.4,1); }
    @keyframes lv-bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .lv-flash { position: fixed; inset: 0; z-index: 500; pointer-events: none; background: radial-gradient(circle, rgba(200,169,74,.55), transparent 70%); opacity: 0; }
    .lv-flash.go { animation: lv-flash-a 1s ease-out; }
    @keyframes lv-flash-a { 0% { opacity: 1; } 100% { opacity: 0; } }

    .lv-note { text-align: center; color: rgba(255,255,255,.45); font-size: 11.5px; margin-top: 12px; }

    .lv-tl { margin-top: 22px; }
    .lv-tl-title { color: #c8a94a; font-size: 11px; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px; }
    .lv-ev {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07);
      border-radius: 12px; padding: 11px 14px; margin-bottom: 8px;
      color: #fff; font-size: 14px;
      animation: lv-in .4s ease-out;
    }
    @keyframes lv-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .lv-ev-time { font-family: 'Oswald', sans-serif; font-size: 12px; color: rgba(255,255,255,.45); min-width: 42px; }
    .lv-ev-icon { font-size: 18px; }
    .lv-ev-label { font-weight: 700; }
    .lv-ev-scorer { color: #e8d48b; font-weight: 700; }
    .lv-ev--goal { background: rgba(200,169,74,.14); border-color: rgba(200,169,74,.45); }

    .lv-empty { text-align: center; color: rgba(255,255,255,.65); padding: 70px 20px; }
    .lv-empty .lv-empty-icon { font-size: 46px; margin-bottom: 12px; }
    .lv-empty a { color: #c8a94a; font-weight: 700; }

    .gv-confetti { position: fixed; z-index: 9999; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; animation: gv-confetti-fly 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
  </style>
  <script src="js/theme.js?v=20260807c"></script>
</head>
<body>
  <div class="lv-flash" id="lv-flash"></div>
  <div class="lv-wrap">
    <div class="lv-head">
      <a href="index.html" class="lv-back">← トップへ</a>
      <div class="lv-brand"><img src="../assets/logo.png" alt="">GRANDE LIVE</div>
      <span style="width:60px"></span>
    </div>
    <div id="lv-content">
      <div class="lv-empty"><div class="lv-empty-icon">⚽</div>読み込み中...</div>
    </div>
  </div>

  <script src="js/mobile-experience.js?v=20260807c"></script>
  <script>
  (function(){
    'use strict';
    var FB_URL = 'https://hp-1-d7bce-default-rtdb.asia-southeast1.firebasedatabase.app';
    var CLUB_ID = 'grande';
    var prevMy = null, prevOpp = null, prevEvCount = null;

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function pad(n){ return n<10?'0'+n:''+n; }
    function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    function fmtTime(ts){ var d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }

    var EV = {
      ko:{icon:'▶️',label:'キックオフ',cls:''},
      ko2:{icon:'▶️',label:'後半キックオフ',cls:''},
      ht:{icon:'⏸',label:'ハーフタイム',cls:''},
      ft:{icon:'🏁',label:'試合終了',cls:''},
      goal:{icon:'⚽',label:'GRANDE ゴール！',cls:'lv-ev--goal'},
      oppgoal:{icon:'😢',label:'失点',cls:''}
    };

    function goldFlash(){
      var f = document.getElementById('lv-flash');
      f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      var colors = ['#c8a94a','#e8d48b','#ffffff','#1f8a4c'];
      var cx = window.innerWidth/2, cy = window.innerHeight*0.3;
      for (var i=0;i<30;i++){
        var p = document.createElement('div');
        p.className = 'gv-confetti';
        var ang = Math.random()*Math.PI*2, dist = 70+Math.random()*140;
        p.style.left = cx+'px'; p.style.top = cy+'px';
        p.style.background = colors[i%colors.length];
        p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
        p.style.setProperty('--dy', (Math.sin(ang)*dist-90)+'px');
        p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
        document.body.appendChild(p);
        (function(el){ setTimeout(function(){ el.remove(); }, 1600); })(p);
      }
    }

    function render(d){
      var c = document.getElementById('lv-content');
      if (!d || !d.date || d.date !== todayStr()){
        c.innerHTML = '<div class="lv-empty"><div class="lv-empty-icon">⚽</div>' +
          '現在ライブ速報中の試合はありません<br><br>' +
          '<a href="matches.html">試合日程・結果を見る →</a></div>';
        return;
      }
      var st = d.status || 'pre';
      var pill = st === 'live'
        ? '<span class="lv-pill lv-pill--live"><span class="lv-dot"></span>LIVE</span>'
        : st === 'ht' ? '<span class="lv-pill">ハーフタイム</span>'
        : st === 'ft' ? '<span class="lv-pill">FULL TIME</span>'
        : '<span class="lv-pill">まもなくキックオフ</span>';

      var evs = (d.events || []).slice().reverse().map(function(ev){
        var m = EV[ev.type] || {icon:'・',label:ev.type,cls:''};
        return '<div class="lv-ev '+m.cls+'">' +
          '<span class="lv-ev-time">'+fmtTime(ev.ts)+'</span>' +
          '<span class="lv-ev-icon">'+m.icon+'</span>' +
          '<span class="lv-ev-label">'+m.label+'</span>' +
          (ev.scorer ? '<span class="lv-ev-scorer">'+esc(ev.scorer)+'</span>' : '') +
          '</div>';
      }).join('');

      c.innerHTML =
        '<div class="lv-status">'+pill+'</div>' +
        '<div class="lv-board">' +
          '<div class="lv-comp">'+esc(d.competition||'')+(d.category?'・'+esc(d.category):'')+'</div>' +
          '<div class="lv-teams">' +
            '<div class="lv-team">GRANDE</div>' +
            '<div class="lv-score" id="lv-score">'+ (d.myScore||0) +'<i>-</i>'+ (d.oppScore||0) +'</div>' +
            '<div class="lv-team">'+esc(d.opponent||'')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="lv-note">'+(st==='ft' ? '応援ありがとうございました！' : 'この画面は自動で更新されます（リロード不要）')+'</div>' +
        (evs ? '<div class="lv-tl"><div class="lv-tl-title">TIMELINE</div>'+evs+'</div>' : '');

      /* ゴール演出：前回よりスコアが増えていたら */
      if (prevMy !== null && (d.myScore||0) > prevMy){
        goldFlash();
        var sc = document.getElementById('lv-score');
        if (sc){ sc.classList.add('bump'); }
      } else if (prevEvCount !== null && (d.events||[]).length > prevEvCount){
        var sc2 = document.getElementById('lv-score');
        if (sc2){ sc2.classList.add('bump'); }
      }
      prevMy = d.myScore||0; prevOpp = d.oppScore||0; prevEvCount = (d.events||[]).length;
    }

    function poll(){
      fetch(FB_URL + '/clubs/' + CLUB_ID + '-live.json?t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(render)
        .catch(function(){ /* 電波断は静かに次回リトライ */ });
    }
    poll();
    setInterval(poll, 8000);
  })();
  </script>
</body>
</html>
