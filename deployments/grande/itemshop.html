var SECRET_KEY = "shop_secret_" + SHOP_CLUB_ID;
function getSecret(){ return localStorage.getItem(SECRET_KEY) || ""; }
function setSecret(v){ localStorage.setItem(SECRET_KEY, v); }

// Firebase RTDBのキーに使えない文字（. # $ [ ]）を置換
function emailToKey(email){
  return String(email||"").trim().toLowerCase().replace(/[.#$\[\]]/g, function(c){
    return c==="." ? "," : "_";
  });
}

// 商品写真・カスタム商品設定の読み込み：認証不要（ショップ画面表示用）
function loadPublicCatalog(){
  return Promise.all([
    fetch(FB_IMAGES_URL + ".json").then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
    fetch(FB_CATALOG_URL + ".json").then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
  ]).then(function(results){
    var images = results[0], cat = results[1];
    var changed = false;
    if(images){ S.productImages = Object.assign({}, S.productImages, images); changed = true; }
    if(cat){
      if(cat.productOrder && cat.productOrder.length){ S.productOrder = cat.productOrder; changed = true; }
      if(Array.isArray(cat.customProds) && cat.customProds.length){ S.customProds = cat.customProds; changed = true; }
      if(cat.prodOverrides && typeof cat.prodOverrides==="object" && Object.keys(cat.prodOverrides).length){ S.prodOverrides = cat.prodOverrides; changed = true; }
    }
    return changed;
  });
}

// 注文一覧の取得：管理者のみ
function fetchOrdersFromCloud(){
  return fetch(FB_ORDERS_URL + ".json?auth=" + encodeURIComponent(getSecret())).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }).then(function(data){
    if(!data) return [];
    var list = Object.keys(data).map(function(k){ return Object.assign({fbKey:k}, data[k]); });
    list.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    return list;
  });
}

function syncOrderStatusPublic(order){
  var emailKey = emailToKey(order.email);
  if(!emailKey) return Promise.resolve();
  var payload = {
    orderId: order.id,
    date: order.date,
    status: order.status,
    items: order.items.map(function(it){ return { pname: it.pname, size: it.size, number: it.number||"", qty: it.qty, delivered: !!it.delivered }; }),
    updatedAt: new Date().toISOString()
  };
  return fetch(FB_STATUS_BY_EMAIL_URL + "/" + emailKey + "/" + encodeURIComponent(order.id) + ".json?auth=" + encodeURIComponent(getSecret()), {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  });
}

function saveProductData(){
  var auth = "?auth=" + encodeURIComponent(getSecret());
  return Promise.all([
    fetch(FB_IMAGES_URL + ".json" + auth, {
      method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(S.productImages)
    }),
    fetch(FB_CATALOG_URL + ".json" + auth, {
      method: "PUT", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ productOrder: S.productOrder, customProds: S.customProds, prodOverrides: S.prodOverrides })
    }),
    fetch(FB_ADMIN_URL + ".json" + auth, {
      method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ imgbbKey: S.imgbbKey })
    })
  ]).then(function(results){
    results.forEach(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); });
  });
}

/* ───────── PRODUCTS (built-in + custom) ─────────
   S.prodOverrides = {商品id: {name,brand,price,...}} 標準商品の上書き設定（クラウド保存） */
function allProds(){
  var base = PRODS.map(function(p){
    var ov = S.prodOverrides[p.id];
    return ov ? Object.assign({}, p, ov) : p;
  });
  return base.concat(S.customProds);
}
function prodById(pid){ return allProds().filter(function(p){ return p.id===pid; })[0]; }
function brandOf(p){ return (p.brand || "").trim() || "その他"; }
function uniqueBrands(){
  var seen = {}, list = [];
  allProds().forEach(function(p){
    var b = brandOf(p);
    if(!seen[b]){ seen[b] = true; list.push(b); }
  });
  return list;
}
function matchBrand(p, filter){ return filter==="すべて" || brandOf(p)===filter; }

function getOrderedProds(){
  var all = allProds();
  if(!S.productOrder.length) return all.slice();
  var map = {};
  all.forEach(function(p){ map[p.id] = p; });
  var ordered = S.productOrder.map(function(id){ return map[id]; }).filter(Boolean);
  var inOrder = S.productOrder;
  all.forEach(function(p){ if(inOrder.indexOf(p.id)<0) ordered.push(p); });
  return ordered;
}
function currentOrderIds(){
  return getOrderedProds().map(function(p){ return p.id; });
}

function moveProduct(pid, dir){
  var order = currentOrderIds();
  var idx = order.indexOf(pid);
  if(idx<0) return;
  var newIdx = idx + dir;
  if(newIdx<0 || newIdx>=order.length) return;
  var tmp = order[idx]; order[idx] = order[newIdx]; order[newIdx] = tmp;
  S.productOrder = order;
  saveProductData().then(function(){ render(); }).catch(function(){ showError("保存に失敗しました"); });
}

/* ドラッグ＆ドロップ並び替え */
var dragPid = null;
function dropProduct(targetPid){
  if(dragPid===null || dragPid===targetPid) return;
  var order = currentOrderIds();
  var from = order.indexOf(dragPid);
  var to = order.indexOf(targetPid);
  if(from<0 || to<0) return;
  order.splice(from,1);
  order.splice(to,0,dragPid);
  S.productOrder = order;
  dragPid = null;
  render();
  saveProductData().then(function(){ showToast("並び順を保存しました ✓"); }).catch(function(){ showError("保存に失敗しました"); });
}

/* 複数選択の一括移動 */
function selectedIds(){
  return currentOrderIds().filter(function(id){ return S.selectedProds[id]; });
}
function moveSelected(mode){
  var order = currentOrderIds();
  var sel = order.filter(function(id){ return S.selectedProds[id]; });
  if(!sel.length) return;
  var rest = order.filter(function(id){ return !S.selectedProds[id]; });
  if(mode==="top"){
    order = sel.concat(rest);
  } else if(mode==="bottom"){
    order = rest.concat(sel);
  } else if(mode==="up"){
    for(var i=1;i<order.length;i++){
      if(S.selectedProds[order[i]] && !S.selectedProds[order[i-1]]){
        var t=order[i-1]; order[i-1]=order[i]; order[i]=t;
      }
    }
  } else if(mode==="down"){
    for(var j=order.length-2;j>=0;j--){
      if(S.selectedProds[order[j]] && !S.selectedProds[order[j+1]]){
        var t2=order[j+1]; order[j+1]=order[j]; order[j]=t2;
      }
    }
  }
  S.productOrder = order;
  render();
  saveProductData().then(function(){ showToast("並び順を保存しました ✓"); }).catch(function(){ showError("保存に失敗しました"); });
}

function uploadToImgBB(file, pid){
  if(!S.imgbbKey){ showError("ImgBBのAPIキーを設定してください（管理者 > ⚙️設定タブ）"); return; }
  S.photoUploading = pid;
  render();
  var reader = new FileReader();
  reader.onload = function(e){
    var base64 = e.target.result.split(",")[1];
    var fd = new FormData();
    fd.append("image", base64);
    fetch("https://api.imgbb.com/1/upload?key=" + encodeURIComponent(S.imgbbKey), {
      method: "POST", body: fd
    }).then(function(r){ return r.json(); })
    .then(function(data){
      if(data.data && data.data.display_url){
        S.productImages[pid] = data.data.display_url;
        return saveProductData().then(function(){
          S.photoUploading = null;
          showToast("写真を保存しました ✓");
          render();
        });
      } else { throw new Error("ImgBB error: " + JSON.stringify(data)); }
    }).catch(function(err){ console.error(err); S.photoUploading = null; showError("アップロードに失敗しました"); render(); });
  };
  reader.readAsDataURL(file);
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ───────── CART ───────── */
function addToCart(pid, size, qty, number){
  var p = prodById(pid);
  number = (number||"").trim();
  var idx = -1;
  // 背番号違いは別ラインとして扱う（同じ商品・サイズでも背番号が違えば合算しない）
  S.cart.forEach(function(i,ii){ if(i.pid===pid && i.size===size && (i.number||"")===number) idx=ii; });
  if(idx>=0) S.cart[idx].qty += qty;
  else S.cart.push({pid:p.id, pname:p.name, size:size, qty:qty, price:p.price, number:number});
  var sel = selFor(p);
  sel.flash = true;
  render();
  setTimeout(function(){ sel.flash=false; render(); }, 700);
  showToast(p.name + "（" + size + "）× " + qty + " をカートに追加 ✓");
}
function cartTotal(){ return S.cart.reduce(function(s,i){ return s+i.price*i.qty; },0); }
function cartCount(){ return S.cart.reduce(function(s,i){ return s+i.qty; },0); }
function cartGrouped(){
  var acc = {};
  S.cart.forEach(function(it){
    if(!acc[it.pid]) acc[it.pid] = {pname:it.pname, items:[]};
    acc[it.pid].items.push(it);
  });
  return acc;
}
function changeCartQty(idx, delta){
  S.cart[idx].qty = Math.max(1, S.cart[idx].qty+delta);
  render();
}
function removeCartItem(idx){
  S.cart.splice(idx,1);
  render();
}

  var oid = genId();
  var order = Object.assign({}, S.form, {id:oid, date:new Date().toISOString(), items:S.cart.map(function(i){return Object.assign({},i);}), total:cartTotal(), status:"未確認"});

  S.placing = true;
  render();

  pushOrderToCloud(order).then(function(){
    S.lastOrder = order;
    S.cart = [];
    S.form = {pName:"",sName:"",cat:TEAMS[0],email:"",pay:PAYS[0],note:""};

    showError("注文の保存に失敗しました。通信環境をご確認のうえ、もう一度お試しください。");

}

/* ───────── ADMIN HELPERS ───────── */
function adminStatsCalc(){
  return allProds().map(function(p){
    var sc = {};
    p.sizes.forEach(function(s){ sc[s]=0; });
    S.orders.forEach(function(o){ o.items.forEach(function(i){ if(i.pid===p.id) sc[i.size]=(sc[i.size]||0)+i.qty; }); });
    var total = Object.keys(sc).reduce(function(a,k){ return a+sc[k]; },0);
    return Object.assign({}, p, {sc:sc, total:total});
  }).filter(function(p){ return p.total>0; });
}
function totalSales(){ return S.orders.reduce(function(s,o){ return s+o.total; },0); }
function bySt(s){ return S.orders.filter(function(o){ return o.status===s; }).length; }

/* ───────── 発注書（ブランド別集計） ───────── */
function productBrands(){
  var seen = {}, list = [];
  allProds().forEach(function(p){
    var b = (p.brand||"").trim();
    if(b && !seen[b]){ seen[b]=true; list.push(b); }
  });
  return list;
}
function purchaseOrderStatsCalc(brand){
  return allProds().filter(function(p){ return (p.brand||"").trim()===brand; }).map(function(p){
    var sc = {};
    (p.sizes||[]).forEach(function(s){ sc[s]=0; });
    S.orders.forEach(function(o){ o.items.forEach(function(i){ if(i.pid===p.id) sc[i.size]=(sc[i.size]||0)+i.qty; }); });
    var total = Object.keys(sc).reduce(function(a,k){ return a+sc[k]; },0);
    return Object.assign({}, p, {sc:sc, total:total});
  }).filter(function(p){ return p.total>0; });
}

function downloadCsv(hdr, rows, filename){
  var csv = [hdr].concat(rows).map(function(r){
    return r.map(function(v){
      var s = String(v);
      return (s.indexOf(",")>=0 || s.indexOf('"')>=0) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",");
  }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download = filename;
  a.click();
}

  var hdr=["注文ID","注文日","保護者氏名","選手氏名","チーム","メール","支払方法","合計","ステータス","備考","商品サマリー"];

    return [o.id,fmtD(o.date),o.pName,o.sName,o.cat,o.email,o.pay,o.total,o.status,o.note||"",o.items.map(function(i){return i.pname+"("+i.size+(i.number?"・背番号"+i.number:"")+")×"+i.qty;}).join(" / ")];

/* ───────── MASTER RENDER ───────── */
function getPath(obj, path){
  var keys = path.split(".");
  var o = obj;
  for(var i=0;i<keys.length;i++){ o = o[keys[i]]; }
  return o;
}
function setPath(obj, path, val){
  var keys = path.split(".");
  var o = obj;
  for(var i=0;i<keys.length-1;i++){ o = o[keys[i]]; }
  o[keys[keys.length-1]] = val;
}
function bindInputs(){
  var els = document.querySelectorAll("[data-bind]");
  for(var i=0;i<els.length;i++){
    (function(el){
      var path = el.getAttribute("data-bind");
      el.value = getPath(S, path);
      var evt = el.tagName==="SELECT" ? "change" : "input";
      el.addEventListener(evt, function(e){ setPath(S, path, e.target.value); });
    })(els[i]);
  }
}
function render(){
  var html = "";
  if(S.page==="shop") html = shopPageHtml();
  else if(S.page==="login") html = loginPageHtml();
  else if(S.page==="admin") html = adminPageHtml();
  else if(S.page==="status") html = statusPageHtml();
  html += cartDrawerHtml();
  html += orderModalHtml();
  html += editProdModalHtml();
  html += toastHtml();
  document.getElementById("app").innerHTML = html;
  bindInputs();
}

  setView:function(v){ S.view=v; render(); },
  addProdToCart:function(pid){ var p=prodById(pid); if(p){ var sel=selFor(p); addToCart(pid, sel.size, sel.qty, sel.number); sel.number=""; } },
  setProdSize:function(pid,sz){ var p=prodById(pid); if(p){ selFor(p).size=sz; render(); } },
  changeProdQty:function(pid,d){ var p=prodById(pid); if(p){ var s=selFor(p); s.qty=Math.max(1,s.qty+d); render(); } },
  changeCartQty:function(idx,d){ changeCartQty(idx,d); },
  removeCartItem:function(idx){ removeCartItem(idx); },
  goCheckout:function(){ S.step=1; render(); },
  confirmStep1:function(){ if(S.form.pName && S.form.sName && S.form.email){ S.step=2; render(); } else showError("必須項目を入力してください"); },
  backToStep1:function(){ S.step=1; render(); },
  closeOrderModal:function(){ S.step=0; render(); },
  closeOrderDone:function(){ S.step=0; S.cart=[]; render(); },
  placeOrder:placeOrder,
  goLogin:function(){ S.page="login"; render(); },
  doLogin:function(){
    var pw = document.getElementById("loginPw").value.trim();
    if(!pw){ S.pwErr="管理者キーを入力してください"; render(); return; }
    setSecret(pw);
    S.pwErr=""; S.loadingAdmin=true; render();
    fetchOrdersFromCloud().then(function(o){
      S.orders=o;
      return fetchAdminConfig();
    }).then(function(){
      S.page="admin"; S.loadingAdmin=false; S.adminAuthed=true; render();
      Promise.all(S.orders.map(syncOrderStatusPublic)).catch(function(){});
      cleanupLegacyOrderStatus();
    }).catch(function(e){
      S.loadingAdmin=false;
      S.pwErr="認証に失敗しました。管理者キーをご確認ください。";
      render();
    });
  },
  goShop:function(){ S.page="shop"; S.pwErr=""; render(); },
  logout:function(){ S.page="shop"; S.adminAuthed=false; render(); },
  backToAdmin:function(){ S.page="admin"; render(); },
  setAdminTab:function(t){ S.adminTab=t; render(); },
  toggleOrder:function(oid){ S.selOid = S.selOid===oid ? null : oid; render(); },
  setOrderStatus:function(oid, st){
    if(S.statusUpdating) return;
    var o = S.orders.filter(function(x){return x.id===oid;})[0];
    if(!o || !o.fbKey){ showError("この注文はクラウド未同期のため更新できません。🔄 最新を取得してください。"); return; }
    S.statusUpdating = oid;
    render();
    updateOrderStatusCloud(o.fbKey, st).then(function(){
      o.status = st;
      S.statusUpdating=null; showToast("ステータスを更新しました"); render();
      syncOrderStatusPublic(o).catch(function(){});
    }).catch(function(e){ S.statusUpdating=null; showError("更新に失敗しました"); render(); });
  },
  toggleItemDelivered:function(oid, itemIdx){
    if(S.itemDeliverUpdating) return;
    var o = S.orders.filter(function(x){return x.id===oid;})[0];
    if(!o || !o.fbKey){ showError("この注文はクラウド未同期のため更新できません。🔄 最新を取得してください。"); return; }
    var it = o.items[itemIdx];
    if(!it) return;
    var newVal = !it.delivered;
    S.itemDeliverUpdating = oid+"-"+itemIdx;
    render();
    setItemDeliveredCloud(o.fbKey, itemIdx, newVal).then(function(){
      it.delivered = newVal;
      S.itemDeliverUpdating = null;
      render();
      syncOrderStatusPublic(o).catch(function(){});
    }).catch(function(e){
      S.itemDeliverUpdating = null;
      showError("更新に失敗しました");
      render();
    });
  },
  deleteOrder:function(oid){
    if(S.statusUpdating || S.deletingOid) return;
    var target = S.orders.filter(function(x){return x.id===oid;})[0];
    if(!target || !target.fbKey){ showError("この注文はクラウド未同期のため削除できません。🔄 最新を取得してください。"); return; }
    if(!confirm("この注文を削除します。よろしいですか？\n（"+target.pName+" / "+target.sName+"・"+fmt(target.total)+"）\n\n※この操作は取り消せません")) return;
    S.deletingOid = oid;
    render();
    deleteOrderCloud(target.fbKey).then(function(){
      S.orders = S.orders.filter(function(x){return x.id!==oid;});
      S.selOid = null;
      S.deletingOid = null;
      showToast("注文を削除しました");
      render();
      deleteOrderStatusPublic(oid, target.email);
    }).catch(function(e){
      S.deletingOid = null;
      showError("削除に失敗しました");
      render();
    });
  },
  setSfSt:function(s){ S.sfSt=s; render(); },
  downloadOrderListCsv:downloadOrderListCsv,
  downloadOrderDetailCsv:downloadOrderDetailCsv,
  printInvoice:printInvoice,
  setPoBrand: function(b){ S.poBrand = b; render(); },
  printPurchaseOrder: function(){ if(S.poBrand) printPurchaseOrder(S.poBrand); },
  refreshOrders:function(){
    S.loadingAdmin=true;
    render();
    fetchOrdersFromCloud().then(function(o){
      S.orders=o; S.loadingAdmin=false; showToast("データを最新に更新しました"); render();
      Promise.all(S.orders.map(syncOrderStatusPublic)).catch(function(){});
    }).catch(function(e){ S.loadingAdmin=false; showError("更新に失敗しました"); });
  },
  goStatusLookup:function(prefillEmail){
    S.page="status"; S.statusLookupId=prefillEmail||""; S.statusLookupResult=null; S.statusLookupErr=""; render();
    if(prefillEmail) App.checkOrderStatus();
  },
  checkOrderStatus:function(){
    var emailInput = document.getElementById("statusLookupInput");
    var email = (emailInput ? emailInput.value : S.statusLookupId).trim();
    if(!email){ S.statusLookupErr="メールアドレスを入力してください"; render(); return; }
    S.statusLookupId = email;
    S.statusLookupLoading = true;
    S.statusLookupErr = "";
    S.statusLookupResult = null;
    render();
    fetchOrdersByEmailPublic(email).then(function(list){
      S.statusLookupLoading = false;
      if(!list.length){ S.statusLookupErr = "該当する注文が見つかりませんでした。注文時に入力したメールアドレスをご確認ください。"; }
      else { S.statusLookupResult = list; }
      render();
    }).catch(function(e){
      S.statusLookupLoading = false;
      S.statusLookupErr = "確認できませんでした。通信環境をご確認のうえ、もう一度お試しください。";
      render();
    });
  },
  saveCfg:function(){ showToast("設定を保存しました（デモ）"); },
  moveProduct:function(pid, dir){ moveProduct(pid, dir); },
  /* ブランド絞り込み・複数選択 */
  setBrandFilter:function(b){ S.brandFilter=b; render(); },
  setAdminBrandFilter:function(b){ S.adminBrandFilter=b; render(); },
  toggleSelectProd:function(pid){ if(S.selectedProds[pid]) delete S.selectedProds[pid]; else S.selectedProds[pid]=true; render(); },
  toggleSelectAllVisible:function(){
    var visible = getOrderedProds().filter(function(p){ return matchBrand(p, S.adminBrandFilter); }).map(function(p){ return p.id; });
    var allSel = visible.length>0 && visible.every(function(id){ return S.selectedProds[id]; });
    if(allSel){ visible.forEach(function(id){ delete S.selectedProds[id]; }); }
    else { visible.forEach(function(id){ S.selectedProds[id]=true; }); }
    render();
  },
  clearSelection:function(){ S.selectedProds={}; render(); },
  moveSelected:function(mode){ moveSelected(mode); },
  /* ドラッグ＆ドロップ */
  dragStart:function(ev, pid){ dragPid = pid; ev.dataTransfer.effectAllowed = "move"; try{ ev.dataTransfer.setData("text/plain", String(pid)); }catch(e){} ev.currentTarget.style.opacity = ".4"; },
  dragOver:function(ev){ ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; },
  dragEnter:function(ev){ if(dragPid!==null && ev.currentTarget) ev.currentTarget.style.border = "2px dashed "+G.g1; },
  dragLeave:function(ev){ if(ev.currentTarget) ev.currentTarget.style.border = "2px solid transparent"; },
  dropOn:function(ev, pid){ ev.preventDefault(); ev.currentTarget.style.border = "2px solid transparent"; dropProduct(pid); },
  dragEnd:function(ev){ if(ev.currentTarget) ev.currentTarget.style.opacity = "1"; dragPid = null; },
  /* 複製・編集・削除 */
  duplicateProduct:function(pid){
    var src = prodById(pid);
    if(!src) return;
    S.editProd = {
      id: Date.now(),
      name: src.name + "（コピー）",
      brand: src.brand, desc: src.desc, price: src.price, cat: src.cat,
      sizes: src.sizes.slice(), reqJ: !!src.reqJ, reqJU: !!src.reqJU,
      _isNew: true, _srcId: pid
    };
    render();
  },
  editProduct:function(pid){
    var custom = S.customProds.filter(function(c){ return c.id===pid; })[0];
    if(custom){
      S.editProd = Object.assign({}, custom, {sizes:custom.sizes.slice(), _isNew:false});
    } else {
      var p = prodById(pid); // 上書き設定を反映した状態
      if(!p) return;
      S.editProd = Object.assign({}, p, {sizes:p.sizes.slice(), _isNew:false, _isBuiltin:true});
    }
    render();
  },
  cancelEditProd:function(){ S.editProd = null; render(); },
  epSetBrand:function(b){ var el = document.getElementById("ep-brand"); if(el) el.value = b; },
  epToggleReq:function(which){
    var j = document.getElementById("ep-reqj"), ju = document.getElementById("ep-reqju");
    if(!j || !ju) return;
    if(which==="J") j.checked = !j.checked;
    else if(which==="JU") ju.checked = !ju.checked;
    else { j.checked = false; ju.checked = false; }
    /* チップの見た目を更新（モーダルは再描画しない＝入力内容を保持） */
    function setChip(id, on, bg, border, color){
      var el = document.getElementById(id);
      if(!el) return;
      el.style.border = "1.5px solid " + (on ? border : "#ddd");
      el.style.background = on ? bg : "#fff";
      el.style.color = on ? color : "#888";
    }
    setChip("ep-chip-j",   j.checked,  "#fff7dd", "#f4c430", "#7a6000");
    setChip("ep-chip-ju",  ju.checked, "#ffe9e9", "#e53935", "#8a1010");
    setChip("ep-chip-opt", !j.checked && !ju.checked, "#f0f0f0", "#888", "#444");
  },
  resetOverride:function(pid){
    if(!confirm("この商品の変更をすべて取り消して、初期設定に戻しますか？")) return;
    delete S.prodOverrides[pid];
    S.editProd = null;
    render();
    saveProductData().then(function(){ showToast("初期設定に戻しました ↺"); }).catch(function(){ showError("保存に失敗しました"); });
  },
  saveEditProd:function(){
    var p = S.editProd;
    if(!p) return;
    var name = (document.getElementById("ep-name").value || "").trim();
    var price = parseInt(document.getElementById("ep-price").value, 10);
    var sizes = (document.getElementById("ep-sizes").value || "").split(/[、,]/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(!name){ showError("商品名を入力してください"); return; }
    if(isNaN(price) || price<0){ showError("価格を正しく入力してください"); return; }
    if(!sizes.length){ showError("サイズを1つ以上入力してください"); return; }
    var saved = {
      id: p.id, name: name,
      brand: (document.getElementById("ep-brand").value || "").trim(),
      desc: (document.getElementById("ep-desc").value || "").trim(),
      price: price,
      cat: document.getElementById("ep-cat").value,
      sizes: sizes,
      reqJ: document.getElementById("ep-reqj").checked,
      reqJU: document.getElementById("ep-reqju").checked
    };
    if(p._isNew){
      S.customProds.push(saved);
      var order = currentOrderIds().filter(function(id){ return id!==saved.id; });
      var srcIdx = order.indexOf(p._srcId);
      if(srcIdx>=0) order.splice(srcIdx+1, 0, saved.id);
      else order.push(saved.id);
      S.productOrder = order;
    } else if(p._isBuiltin){
      /* 標準商品：元データは変えず、上書き設定として保存 */
      S.prodOverrides[p.id] = {
        name: saved.name, brand: saved.brand, desc: saved.desc,
        price: saved.price, cat: saved.cat, sizes: saved.sizes,
        reqJ: saved.reqJ, reqJU: saved.reqJU
      };
    } else {
      var idx = -1;
      S.customProds.forEach(function(c,ci){ if(c.id===p.id) idx=ci; });
      if(idx>=0) S.customProds[idx] = saved;
    }
    S.editProd = null;
    render();
    saveProductData().then(function(){ showToast(p._isNew ? "商品を複製しました ✓" : "商品を保存しました ✓"); }).catch(function(){ showError("保存に失敗しました"); });
  },
  deleteCustomProd:function(pid){
    var p = S.customProds.filter(function(c){ return c.id===pid; })[0];
    if(!p) return;
    if(!confirm("「"+p.name+"」を削除しますか？")) return;
    S.customProds = S.customProds.filter(function(c){ return c.id!==pid; });
    S.productOrder = S.productOrder.filter(function(id){ return id!==pid; });
    delete S.productImages[pid];
    render();
    saveProductData().then(function(){ showToast("商品を削除しました"); }).catch(function(){ showError("削除に失敗しました"); });
  },
  handlePhotoUpload:function(pid, input){ if(input.files && input.files[0]) uploadToImgBB(input.files[0], pid); },
  deletePhoto:function(pid){
    if(!confirm("この写真を削除しますか？")) return;
    delete S.productImages[pid];
    saveProductData().then(function(){ showToast("写真を削除しました"); render(); }).catch(function(){ showError("削除に失敗しました"); });
  },
  saveImgbbKey:function(){
    var input = document.getElementById("imgbb-key-input");
    if(input) S.imgbbKey = input.value.trim();
    saveProductData().then(function(){ showToast("APIキーを保存しました ✓"); render(); }).catch(function(){ showError("保存に失敗しました"); });
  }
};

render();

/* ページ読み込み時に写真・カスタム商品設定を取得してショップに反映（認証不要） */
loadPublicCatalog().then(function(changed){ if(changed) render(); }).catch(function(){});

})();
</script>
</body>
</html>
